name: Experimental unified single-DLL CrimsonSkiesFix (NOT RELEASE)

on:
  push:
    branches: [main]
    paths:
      - 'CrimsonSkiesFix/runtime-unified/**'
      - 'CrimsonSkiesFix/loader-alias/tools/**'
      - 'CrimsonSkiesFix/src/**'
      - 'CrimsonSkiesFix/installer/**'
      - 'CrimsonSkiesFix/loader-winmm/src/bin/alias_import_*.rs'
      - '.github/workflows/unified-fix-prototype.yml'
  pull_request:
    paths:
      - 'CrimsonSkiesFix/runtime-unified/**'
      - 'CrimsonSkiesFix/loader-alias/tools/**'
      - 'CrimsonSkiesFix/src/**'
      - 'CrimsonSkiesFix/installer/**'
      - 'CrimsonSkiesFix/loader-winmm/src/bin/alias_import_*.rs'
      - '.github/workflows/unified-fix-prototype.yml'
  workflow_dispatch:

# Keep only the newest validation when the feature branch advances quickly.
concurrency:
  group: unified-fix-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unified-windows-x86:
    runs-on: windows-latest
    name: Build and smoke test single fix.dll + mandatory installer (x86)
    defaults:
      run:
        working-directory: CrimsonSkiesFix
    env:
      RUSTFLAGS: -C target-feature=+crt-static
      CRIMSONSKIESFIX_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      CRIMSONSKIESFIX_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      # Build the same five-edition candidate on PRs and main after merge.
      # This workflow produces test artifacts only, never publishes a release.
      INSTALLER_FEATURE: native-usde-updater
      CRIMSONSKIESFIX_BUNDLED_DLL: ${{ github.workspace }}/CrimsonSkiesFix/runtime-unified/target/i686-pc-windows-msvc/release/fix.dll
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: rustup target add i686-pc-windows-msvc
      - name: Record resolved dependency and compiler metadata
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'unified-dependency-locks' | Out-Null
          $runtime = cargo metadata --locked --format-version 1 --filter-platform i686-pc-windows-msvc --manifest-path runtime-unified/Cargo.toml
          if($LASTEXITCODE -ne 0){throw 'Runtime metadata failed'}
          $installer = cargo metadata --locked --format-version 1 --filter-platform i686-pc-windows-msvc --manifest-path installer/Cargo.toml --features $env:INSTALLER_FEATURE
          if($LASTEXITCODE -ne 0){throw 'Installer metadata failed'}
          foreach($item in @(@{Name='runtime-unified';Data=$runtime},@{Name='installer';Data=$installer})){
            $meta=($item.Data -join "`n") | ConvertFrom-Json
            $inventory=@($meta.packages | Sort-Object name,version | ForEach-Object {
              [ordered]@{name=$_.name;version=$_.version;source=$_.source;license=$_.license;license_file=if($_.license_file){Split-Path -Leaf $_.license_file}else{$null};repository=$_.repository}
            })
            ConvertTo-Json -InputObject $inventory -Depth 5 | Set-Content -Encoding utf8 "unified-dependency-locks/$($item.Name)-packages.json"
            if($item.Name -eq 'runtime-unified'){
              $root=@($meta.packages | Where-Object name -eq 'crimsonskiesfix-unified-runtime')
              if($root.Count -ne 1){throw 'Missing unique runtime package'}
              "EXPECTED_CANDIDATE_VERSION=$($root[0].version)" | Add-Content -Encoding utf8 $env:GITHUB_ENV
            }
          }
          $rust=rustc -Vv
          if($LASTEXITCODE -ne 0){throw 'rustc version failed'}
          $cargo=cargo -Vv
          if($LASTEXITCODE -ne 0){throw 'cargo version failed'}
          @($rust; $cargo; "ImageOS=$env:ImageOS"; "ImageVersion=$env:ImageVersion") | Set-Content -Encoding utf8 'unified-dependency-locks/toolchain.txt'
      - name: Unit-test and compile combined fix.dll
        shell: pwsh
        run: |
          cargo test --locked --manifest-path runtime-unified/Cargo.toml --target i686-pc-windows-msvc
          if($LASTEXITCODE -ne 0){throw 'Unified runtime tests failed'}
          cargo build --locked --manifest-path runtime-unified/Cargo.toml --release --target i686-pc-windows-msvc
          if($LASTEXITCODE -ne 0){throw 'Unified runtime build failed'}
      - name: Verify exact DirectDraw export surface and no static WinMM/DDraw dependencies
        shell: pwsh
        run: |
          python loader-alias/tools/test_verify_alias_pe.py -v
          if($LASTEXITCODE -ne 0){throw 'PE parser tests failed'}
          python loader-alias/tools/verify_alias_pe.py --unified runtime-unified/target/i686-pc-windows-msvc/release/fix.dll
          if($LASTEXITCODE -ne 0){throw 'Unified runtime import/export gate failed'}
      - name: Compile and test unified installer with only fix.dll embedded
        shell: pwsh
        run: |
          cargo test --locked --manifest-path installer/Cargo.toml --features $env:INSTALLER_FEATURE --target i686-pc-windows-msvc
          if($LASTEXITCODE -ne 0){throw 'Unified installer tests failed'}
          cargo build --locked --manifest-path installer/Cargo.toml --features $env:INSTALLER_FEATURE --release --target i686-pc-windows-msvc
          if($LASTEXITCODE -ne 0){throw 'Unified installer compilation failed'}
          $exe='installer/target/i686-pc-windows-msvc/release/CrimsonSkiesFix.exe'
          $version=(& $exe --version) -join "`n"
          if($LASTEXITCODE -ne 0 -or $version -notmatch 'NATIVE US/DE LOCAL UPDATE' -or $version -notmatch $env:CRIMSONSKIESFIX_COMMIT.Substring(0,8)){
            throw "Wrong installer variant: $version"
          }
          $expectedIdentity="CrimsonSkiesFix $env:EXPECTED_CANDIDATE_VERSION-$($env:CRIMSONSKIESFIX_COMMIT.Substring(0,8)) Windows-x86"
          if(!$version.StartsWith($expectedIdentity+' ')){throw "Launcher/runtime version mismatch: $version; expected $expectedIdentity"}
          New-Item -ItemType Directory -Force 'unified-empty-tree' | Out-Null
          Copy-Item $exe 'unified-empty-tree/CrimsonSkiesFix.exe'
          & './unified-empty-tree/CrimsonSkiesFix.exe' --launch-no-verify
          if($LASTEXITCODE -ne 2){throw 'Unchecked launch of nonexistent game should fail, not install'}
          if(Test-Path 'unified-empty-tree/game'){throw 'Unchecked launch created unexpected game folder'}
          if($env:INSTALLER_FEATURE -eq 'native-usde-updater'){
            & './unified-empty-tree/CrimsonSkiesFix.exe' --install-only
            if($LASTEXITCODE -ne 2){throw 'Missing authenticated media must be refused'}
            if(Test-Path 'unified-empty-tree/game'){throw 'Missing media created a game directory'}
            if(!(Test-Path 'unified-empty-tree/CrimsonSkiesFix_installer.log')){throw 'Missing installer diagnostic'}
            # A no-argument, detached process must also fail without a modal
            # dialog when the existing noninteractive flag is set.
            $psi=[System.Diagnostics.ProcessStartInfo]::new()
            $psi.FileName=(Resolve-Path 'unified-empty-tree/CrimsonSkiesFix.exe').Path
            $psi.UseShellExecute=$false
            $psi.CreateNoWindow=$true
            $psi.Environment.Remove('CI') | Out-Null
            $psi.Environment.Remove('GITHUB_ACTIONS') | Out-Null
            $psi.Environment['CRIMSONSKIESFIX_NONINTERACTIVE']='1'
            $child=[System.Diagnostics.Process]::Start($psi)
            try {
              if(!$child.WaitForExit(20000)){
                $child.Kill()
                throw 'Unattended installer did not exit (unexpected blocking dialog)'
              }
              if($child.ExitCode -ne 2){throw "Unexpected unattended exit: $($child.ExitCode)"}
            } finally { $child.Dispose() }
            if(Test-Path 'unified-empty-tree/game'){throw 'Unattended missing-media launch created game folder'}
            Write-Host 'INSTALLER-NONINTERACTIVE PASS: detached no-argument launch exits with 2'
          }
          $global:LASTEXITCODE=0
      - name: Build synthetic suspended-process DirectDraw import fixture for fix.dll
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'unified-synthetic-smoke' | Out-Null
          rustc --edition 2021 --target i686-pc-windows-msvc --cfg 'feature="unified-fix-install"' -C target-feature=+crt-static -C panic=abort -o unified-synthetic-smoke/alias_import_launcher.exe loader-winmm/src/bin/alias_import_launcher.rs
          if($LASTEXITCODE -ne 0){throw 'Standalone unified import launcher could not compile'}
          rustc --edition 2021 --target i686-pc-windows-msvc --cfg unified_alias -C target-feature=+crt-static -C panic=abort -o unified-synthetic-smoke/alias_import_fixture.exe loader-winmm/src/bin/alias_import_fixture.rs
          if($LASTEXITCODE -ne 0){throw 'Synthetic x86 WinMM/DDraw fixture could not compile'}
          Copy-Item runtime-unified/target/i686-pc-windows-msvc/release/fix.dll unified-synthetic-smoke/
          $launcher=(Resolve-Path 'unified-synthetic-smoke/alias_import_launcher.exe').Path
          $fixture=(Resolve-Path 'unified-synthetic-smoke/alias_import_fixture.exe').Path
          # Production fix.dll MUST refuse the unapproved fixture and exit(1).
          # The noninteractive flag suppresses only the refusal MessageBoxW:
          # the SHA gate, rejection and process termination remain intact.
          $env:CRIMSON_ALIAS_REAL='1'
          $env:CRIMSONSKIESFIX_NONINTERACTIVE='1'
          & $launcher $fixture
          $exit=$LASTEXITCODE
          Remove-Item Env:CRIMSON_ALIAS_REAL
          Remove-Item Env:CRIMSONSKIESFIX_NONINTERACTIVE
          if($exit -ne 1){throw "Native Win32 unified synthetic EXE must be REJECTED with exit=1, actual=$exit"}
          Write-Host 'UNIFIED-WINDOWS-SMOKE PASS: unsupported PE32 rejected after native fix.dll load'
          $global:LASTEXITCODE=0
      - name: Package test-only one-exe installer, SHA and instructions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'unified-dist' | Out-Null
          $exe='unified-dist/CrimsonSkiesFix.exe'
          Copy-Item installer/target/i686-pc-windows-msvc/release/CrimsonSkiesFix.exe $exe
          Copy-Item installer/README-native-usde.md 'unified-dist/README-EXPERIMENTAL.md'
          "SHA256=$((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant())" | Set-Content 'unified-dist/CrimsonSkiesFix.sha256'
          $bytes=[IO.File]::ReadAllBytes((Resolve-Path $exe))
          if($bytes.Length -lt 256 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90){throw 'Missing MZ header'}
          $pe=[BitConverter]::ToInt32($bytes,60)
          if($pe -lt 64 -or $pe -gt ($bytes.Length-26)){throw 'Invalid PE offset'}
          if([BitConverter]::ToUInt32($bytes,$pe) -ne 0x4550 -or
             [BitConverter]::ToUInt16($bytes,$pe+4) -ne 0x14c -or
             [BitConverter]::ToUInt16($bytes,$pe+24) -ne 0x10b -or
             ([BitConverter]::ToUInt16($bytes,$pe+22) -band 0x2000) -ne 0){
            throw 'Launcher must be an x86 PE32 EXE, not a DLL'
          }
          $files=@(Get-ChildItem 'unified-dist' -File -Recurse | ForEach-Object {$_.FullName.Substring((Resolve-Path 'unified-dist').Path.Length+1)})
          $expected=@('CrimsonSkiesFix.exe','CrimsonSkiesFix.sha256','README-EXPERIMENTAL.md')
          if(Compare-Object $files $expected){throw 'Unexpected test artifact contents'}
          Write-Host "CANDIDATE-PACKAGE PASS: single x86 launcher, hash and instructions; commit $env:CRIMSONSKIESFIX_COMMIT"
      - name: Check that dependency locks stayed unchanged
        shell: pwsh
        run: |
          git diff --exit-code -- installer/Cargo.lock runtime-unified/Cargo.lock
          if($LASTEXITCODE -ne 0){throw 'Cargo dependency locks changed during build'}
      - name: Record resolved Cargo dependency locks for review
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'unified-dependency-locks' | Out-Null
          Copy-Item installer/Cargo.lock 'unified-dependency-locks/installer-Cargo.lock'
          Copy-Item runtime-unified/Cargo.lock 'unified-dependency-locks/runtime-unified-Cargo.lock'
          @("Commit=$env:CRIMSONSKIESFIX_COMMIT",
            "CandidateVersion=$env:EXPECTED_CANDIDATE_VERSION",
            "LauncherSHA256=$((Get-FileHash 'unified-dist/CrimsonSkiesFix.exe' -Algorithm SHA256).Hash.ToLowerInvariant())",
            "RuntimeSHA256=$((Get-FileHash 'runtime-unified/target/i686-pc-windows-msvc/release/fix.dll' -Algorithm SHA256).Hash.ToLowerInvariant())",
            "InstallerCargoLockSHA256=$((Get-FileHash 'installer/Cargo.lock' -Algorithm SHA256).Hash.ToLowerInvariant())",
            "RuntimeCargoLockSHA256=$((Get-FileHash 'runtime-unified/Cargo.lock' -Algorithm SHA256).Hash.ToLowerInvariant())") | Set-Content -Encoding utf8 'unified-dependency-locks/build-commit.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: CrimsonSkiesFix-UNIFIED-DEPENDENCY-LOCKS
          path: CrimsonSkiesFix/unified-dependency-locks/*
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: CrimsonSkiesFix-UNIFIED-X86-TEST-ONLY
          path: CrimsonSkiesFix/unified-dist/*
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: CrimsonSkiesFix-UNIFIED-SYNTHETIC-WINE-SMOKE
          path: CrimsonSkiesFix/unified-synthetic-smoke/*
          retention-days: 1
          if-no-files-found: error

  unified-wine32-smoke:
    name: Wine32 synthetic import alias and native WinMM (no game data)
    runs-on: ubuntu-24.04
    needs: unified-windows-x86
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CrimsonSkiesFix-UNIFIED-SYNTHETIC-WINE-SMOKE
          path: smoke
      - uses: actions/download-artifact@v4
        with:
          name: CrimsonSkiesFix-UNIFIED-X86-TEST-ONLY
          path: installer-smoke
      - name: Install clean Wine32 and virtual display
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends wine wine32:i386 xvfb xauth
      - name: Run actual unified fix.dll with synthetic unknown game under Wine
        env:
          WINEARCH: win32
          WINEPREFIX: ${{ runner.temp }}/crimson-unified-smoke-prefix
          WINEDEBUG: -all
          CRIMSON_ALIAS_REAL: '1'
          CRIMSONSKIESFIX_NONINTERACTIVE: '1'
        run: |
          set -euo pipefail
          timeout 120s xvfb-run -a wineboot -u
          exe="$(winepath -w "$PWD/smoke/alias_import_fixture.exe" | tr -d '\r')"
          set +e
          timeout 120s xvfb-run -a wine "$PWD/smoke/alias_import_launcher.exe" "$exe"
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "Expected the production fix.dll to reject unsupported synthetic EXE with exit 1, got $code"
            exit 1
          fi
          echo 'UNIFIED-WINE32-SMOKE PASS: native WinMM unaffected; synthetic executable rejected by core'

      - name: Wine32 unattended installer error path (no game data)
        env:
          WINEARCH: win32
          WINEPREFIX: ${{ runner.temp }}/crimson-unified-smoke-prefix
          WINEDEBUG: -all
          CRIMSONSKIESFIX_NONINTERACTIVE: '1'
        run: |
          set -euo pipefail
          version="$(timeout 60s xvfb-run -a wine "$PWD/installer-smoke/CrimsonSkiesFix.exe" --version)"
          if [[ "$version" != *"NATIVE US/DE LOCAL UPDATE"* ]]; then
            echo 'Wrong installer variant: expected the five-edition candidate'
            exit 1
          fi
          expected="$(sed -n 's/^SHA256=//p' installer-smoke/CrimsonSkiesFix.sha256 | tr -d '\r')"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          actual="$(sha256sum installer-smoke/CrimsonSkiesFix.exe | cut -d' ' -f1)"
          test "$actual" = "$expected"
          set +e
          timeout 60s xvfb-run -a env -u CI -u GITHUB_ACTIONS wine "$PWD/installer-smoke/CrimsonSkiesFix.exe"
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "Expected unattended missing-media exit 2, got $code"
            exit 1
          fi
          test ! -e installer-smoke/game
          grep -q 'AUTO_INSTALL_RESULT=ERROR' installer-smoke/CrimsonSkiesFix_installer.log
          echo 'INSTALLER-WINE32-NONINTERACTIVE PASS: no-argument launch exits with 2'
