name: Build and test Rust patcher
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test
      - name: Build release
        run: cargo build --release
      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: crimson-patcher-${{ matrix.os }}
          path: |
            target/release/crimson-patcher
            target/release/crimson-patcher.exe
          if-no-files-found: error

  linux-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl compiler
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build static Linux binary
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Verify static ELF
        run: |
          file target/x86_64-unknown-linux-musl/release/crimson-patcher
          ! readelf -l target/x86_64-unknown-linux-musl/release/crimson-patcher | grep INTERP
      - name: Upload static executable
        uses: actions/upload-artifact@v4
        with:
          name: crimson-patcher-linux-static-x86_64
          path: target/x86_64-unknown-linux-musl/release/crimson-patcher
          if-no-files-found: error
