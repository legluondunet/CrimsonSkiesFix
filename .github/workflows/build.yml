name: SafeDisc Rust patcher (Windows)

on:
  push:
    paths:
      - 'SafeDisc/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'SafeDisc/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: SafeDisc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test
      - name: Build Windows release
        run: cargo build --release
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: crimson-patcher-windows-x64
          path: SafeDisc/target/release/crimson-patcher.exe
          if-no-files-found: error
