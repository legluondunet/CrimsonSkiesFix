name: Build and test Rust patcher (Windows)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test
      - name: Build Windows release
        run: cargo build --release
      - name: Install Windows x86 target (research helper)
        run: rustup target add i686-pc-windows-msvc
      - name: Build experimental x86 DLL memory probe
        run: cargo build --release --target i686-pc-windows-msvc --features research --bin safedisc-memory-probe
      - name: Upload x86 research helper
        uses: actions/upload-artifact@v4
        with:
          name: safedisc-memory-probe-win32
          path: target/i686-pc-windows-msvc/release/safedisc-memory-probe.exe
          if-no-files-found: error
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: crimson-patcher-windows-x64
          path: target/release/crimson-patcher.exe
          if-no-files-found: error
