name: Experimental CrimsonFix DirectDraw DLL x86

on:
  push:
    paths:
      - 'crimsonfix/**'
      - '.github/workflows/crimsonfix-x86.yml'
  pull_request:
    paths:
      - 'crimsonfix/**'
      - '.github/workflows/crimsonfix-x86.yml'
  workflow_dispatch:

jobs:
  windows-x86:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    defaults:
      run:
        working-directory: crimsonfix
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust i686 MSVC target
        run: rustup target add i686-pc-windows-msvc
      - name: Unit tests in 32-bit mode
        run: cargo test --target i686-pc-windows-msvc
      - name: Compile release DirectDraw proxy
        run: cargo build --release --target i686-pc-windows-msvc
      - name: Verify PE machine is Intel x86
        shell: pwsh
        run: |
          $dll = 'target/i686-pc-windows-msvc/release/ddraw.dll'
          $bytes = [System.IO.File]::ReadAllBytes($dll)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          if ($machine -ne 0x014C) { throw "Not an i686 DLL: 0x$($machine.ToString('X'))" }
          Write-Host "Verified PE machine: IMAGE_FILE_MACHINE_I386 (0x014C)"
      - name: Prepare clean game directory layout
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'dist/CrimsonFix' | Out-Null
          Copy-Item 'target/i686-pc-windows-msvc/release/ddraw.dll' 'dist/ddraw.dll'
          Copy-Item 'CrimsonFix/CrimsonFix.ini' 'dist/CrimsonFix/CrimsonFix.ini'
          Copy-Item 'README.md' 'dist/CrimsonFix/README.md'
          $files = @(Get-ChildItem -LiteralPath dist -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'ddraw.dll') {
            throw 'Invalid game-root layout: exactly one ddraw.dll permitted'
          }
          if (-not (Test-Path 'dist/CrimsonFix/CrimsonFix.ini')) { throw 'Missing nested config' }
          $disabled = @(Get-Content 'dist/CrimsonFix/CrimsonFix.ini' | Where-Object { $_.Trim() -eq 'Log=0' })
          if ($disabled.Count -ne 1) { throw 'Default logging must be disabled' }
          if (Test-Path 'dist/CrimsonFix/CrimsonFix.log') { throw 'Log must not be bundled' }
      - name: Publish experimental x86 proxy and clean game layout
        uses: actions/upload-artifact@v4
        with:
          name: CrimsonFix-ddraw-Windows-x86-EXPERIMENTAL
          path: crimsonfix/dist/
          if-no-files-found: error
