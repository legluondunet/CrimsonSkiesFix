# One-time owner-authorized publication of the exact previously CI-verified 1.0 binary.
# Trigger: this workflow's initial commit to main. Future ordinary pushes do not
# match the path filter. An existing release is never replaced.
name: Publish CrimsonSkiesFix 1.0
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-crimsonskiesfix-v1.0.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish exact verified standalone EXE
    if: github.repository == 'legluondunet/CrimsonSkiesFix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact passing source commit
        uses: actions/checkout@v4
        with:
          ref: 5a9274d0af8018a346af2fa8e50e2e28dffc6d9d
          persist-credentials: false

      - name: Validate version and successful source-matched CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5a9274d0af8018a346af2fa8e50e2e28dffc6d9d"
          grep -qx 'version = "1.0.0"' <(grep '^version = ' CrimsonSkiesFix/Cargo.toml | head -n 1)
          grep -qx 'version = "1.0.0"' <(grep '^version = ' CrimsonSkiesFix/installer/Cargo.toml | head -n 1)
          run="repos/$GITHUB_REPOSITORY/actions/runs/43485004103"
          test "$(gh api "$run" --jq '.head_sha')" = "5a9274d0af8018a346af2fa8e50e2e28dffc6d9d"
          test "$(gh api "$run" --jq '.conclusion')" = "success"
          gh api "$run/jobs?per_page=100" --jq '.jobs[] | select(.name == "windows-x86" or .name == "verify-single-download") | [.name, .conclusion] | @tsv' > jobs.tsv
          grep -qx $'windows-x86\tsuccess' jobs.tsv
          grep -qx $'verify-single-download\tsuccess' jobs.tsv

      - name: Retrieve the already-tested one-file Windows x86 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 43485004103 --repo "$GITHUB_REPOSITORY" \
            --name CrimsonSkiesFix-Windows-x86-1.0 --dir release-payload
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct
          files = sorted(p for p in Path("release-payload").rglob("*") if p.is_file())
          if files != [Path("release-payload/CrimsonSkiesFix.exe")]:
              raise SystemExit(f"Release must contain exactly one standalone EXE, got: {files}")
          data = files[0].read_bytes()
          if len(data) < 0x100 or data[:2] != b"MZ":
              raise SystemExit("Invalid DOS header")
          pe = struct.unpack_from("<I", data, 0x3c)[0]
          if not 0x40 <= pe <= len(data) - 26 or data[pe:pe+4] != b"PE\0\0":
              raise SystemExit("Invalid PE header")
          machine = struct.unpack_from("<H", data, pe+4)[0]
          magic = struct.unpack_from("<H", data, pe+24)[0]
          flags = struct.unpack_from("<H", data, pe+22)[0]
          if machine != 0x14c or magic != 0x10b or not(flags & 2):
              raise SystemExit("Artifact is not a 32-bit Windows executable")
          sha = hashlib.sha256(data).hexdigest()
          Path("exe-sha256.txt").write_text(f"{sha}  CrimsonSkiesFix.exe\n")
          Path("exe-size.txt").write_text(str(len(data))+"\n")
          print(f"CrimsonSkiesFix.exe: {len(data)} bytes, SHA256={sha}")
          PY

      - name: Publish v1.0 GitHub Release with the verified EXE
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v1.0 release already exists; will not replace it" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exe_sha="$(awk '{print $1}' exe-sha256.txt)"
          exe_size="$(cat exe-size.txt)"
          cat > RELEASE_NOTES.md <<'NOTES'
          # CrimsonSkiesFix 1.0

          First standalone release of **CrimsonSkiesFix**, a free/open-source Windows x86 installer and DirectDraw compatibility patch for **Crimson Skies (2000)**.

          **Download:** `CrimsonSkiesFix.exe` (one executable). Place it in a writable directory. The installer can recognize and extract supported authentic original game ISO/CUE images, apply the official 1.02 game update, verify or repair an installation, and launch the game with the integrated DirectDraw patch.

          **Game content is not included.** You must supply your original game media, the official 1.02 update, and a supported decrypted 1.02 executable from your own installation. The installer validates exact known file identities before installing.

          ## Highlights
          - Borderless desktop-sized presentation, widescreen 3D/FOV/HUD support, original 4:3 menus/videos, optional native 4:3 gameplay, and frame-rate limiting.
          - Startup/Video-menu fixes, version signature, focus/Alt-Tab improvements, and an authenticated Wine/Proton-only ROFFILE.DLL memory safety workaround.
          - Verified CD/official updater installation for supported FR, DE and USA/Europe media; game data and user saves preserved by the supported installation/repair workflow.
          - Separate logs: `CrimsonSkiesFix_installer.log` (installation/repair/error), `CrimsonSkiesFix.log` (fresh game runtime diagnostics) and `CrimsonSkiesFix_inspect.log` (explicit CD analysis).

          ## Command line
          - No arguments: verify/install/repair, then launch.
          - `--install-only`: verify/install/repair, without starting the game.
          - `--verify`: verify installed game and integrated DirectDraw patch.
          - `--launch-no-verify`: attempt a direct game launch, explicitly without verification or repair.
          - `--inspect image.iso` or `--inspect image.cue [image.bin|image.img]`: produce a dedicated original-CD report.
          - `--verbose`, `--version`, `--help`, `-h`.

          ## Compatibility and known limitations
          - **FR and DE:** tested by the project owner with real game sessions under Manjaro + GE-Proton11-12 / Wine 11.0 on earlier release-candidate builds.
          - **USA/Europe:** exact original CUE/BIN authenticated (112/112 files), and `--install-only` installation succeeded (45 game files extracted, eight CABs expanded); *USA/Europe gameplay has not been verified*.
          - **Native Windows 11:** x86 DLL loader/exports and build tests pass in CI; a preceding single-DLL build was tested in a hardware-rendered mission with a reduced diagnostic configuration, but the complete final 1.0 default-graphics, DPI, borderless and GOS runtime path has **not** been fully gameplay-validated on native Windows. See the historical [Windows compatibility issue #22](https://github.com/legluondunet/CrimsonSkiesFix/issues/22).
          - Other hardware, media variants, modified game executables, and third-party widescreen executables are not claimed supported.

          This is **version 1.0**, published with the compatibility scope above; no additional owner-side manual test is claimed. The project is licensed **GPL-3.0-or-later**.

          **Source commit:** `5a9274d0af8018a346af2fa8e50e2e28dffc6d9d`.
          NOTES
          printf '\n**Published Windows x86 EXE:** %s bytes; SHA-256: `%s`.\n' "$exe_size" "$exe_sha" >> RELEASE_NOTES.md
          gh release create v1.0 release-payload/CrimsonSkiesFix.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target 5a9274d0af8018a346af2fa8e50e2e28dffc6d9d \
            --title "CrimsonSkiesFix 1.0" \
            --notes-file RELEASE_NOTES.md \
            --latest
          gh release view v1.0 --repo "$GITHUB_REPOSITORY" --json url,name,tagName,assets \
            --jq '{url,name,tagName,assets:[.assets[]|{name,size}]}'
          {
            echo "## CrimsonSkiesFix 1.0 published"
            echo "Source commit: \`5a9274d0af8018a346af2fa8e50e2e28dffc6d9d\`"
            echo "EXE SHA-256: \`$exe_sha\`"
            echo "EXE size: $exe_size bytes"
          } >> "$GITHUB_STEP_SUMMARY"
