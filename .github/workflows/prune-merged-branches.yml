name: Cleanup merged PR branches (safe)

on:
  push:
    branches:
      - maintenance/safe-pr-branch-cleanup-20261117
    paths:
      - '.github/scripts/prune_merged_branches.py'
      - '.github/workflows/prune-merged-branches.yml'
  schedule:
    - cron: '31 3 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulate only (recommended for first run)'
        type: boolean
        required: true
        default: true
      min_age_days:
        description: 'Minimum number of days since PR merge (0-365)'
        type: number
        required: true
        default: 7

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: safe-pr-branch-prune
  cancel-in-progress: false

jobs:
  policy-tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test deletion eligibility policy (no API writes)
        run: python3 .github/scripts/prune_merged_branches.py --self-test
      - name: Dry-run test against repository branches (no deletes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/prune_merged_branches.py --dry-run --min-age-days 7

  cleanup:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Unit-test branch safety gates before deletion
        run: python3 .github/scripts/prune_merged_branches.py --self-test
      - name: Inspect and optionally delete merged PR branches
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_DRY_RUN: ${{ inputs.dry_run }}
          REQUESTED_MIN_AGE: ${{ inputs.min_age_days }}
          ALLOW_BRANCH_DELETION: YES
        shell: bash
        run: |
          set -euo pipefail
          args=(--min-age-days "${REQUESTED_MIN_AGE:-7}")
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            args+=(--apply)
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${REQUESTED_DRY_RUN}" == "false" ]]; then
            args+=(--apply)
          else
            args+=(--dry-run)
          fi
          python3 .github/scripts/prune_merged_branches.py "${args[@]}"
