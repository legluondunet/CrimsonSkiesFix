name: CrimsonSkiesFix DirectDraw DLL x86

on:
  push:
    paths:
      - 'CrimsonSkiesFix/**'
      - '.github/workflows/crimsonskiesfix-x86.yml'
  pull_request:
    paths:
      - 'CrimsonSkiesFix/**'
      - '.github/workflows/crimsonskiesfix-x86.yml'
  workflow_dispatch:

jobs:
  windows-x86:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    defaults:
      run:
        working-directory: CrimsonSkiesFix
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull_request checkout defaults to a synthetic merge commit.
          # Build the actual PR head recorded in build-info.txt instead.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Independent release candidate verifier self-test
        run: python tools/verify_release_candidate.py --self-test
      - name: External game exit observer self-test (no game required)
        run: python tools/verify_game_exit.py --self-test
      - name: Read-only GOS script inspector self-test
        run: python tools/inspect_gos_scripts.py --self-test
      - name: Read-only ROF UI archive inspector self-test
        run: python tools/inspect_gos_rof.py --self-test
      - name: Reversible native GOS disabled-widget overlay self-test
        run: python tools/patch_gos_video_overlay.py --self-test
      - name: Install Rust i686 MSVC target
        run: rustup target add i686-pc-windows-msvc
      - name: Unit tests in 32-bit mode
        env:
          CRIMSONSKIESFIX_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: cargo test --locked --target i686-pc-windows-msvc
      - name: Compile release DirectDraw proxy
        env:
          CRIMSONSKIESFIX_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: cargo build --locked --release --target i686-pc-windows-msvc
      - name: Verify all 22 native DirectDraw exports and canonical ordinals
        run: python tools/verify_ddraw_exports.py --dll target/i686-pc-windows-msvc/release/ddraw.dll --definitions src/ddraw_exports.def
      - name: Verify PE machine is Intel x86
        shell: pwsh
        run: |
          $dll = 'target/i686-pc-windows-msvc/release/ddraw.dll'
          $bytes = [System.IO.File]::ReadAllBytes($dll)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          if ($machine -ne 0x014C) { throw "Not an i686 DLL: 0x$($machine.ToString('X'))" }
          Write-Host "Verified PE machine: IMAGE_FILE_MACHINE_I386 (0x014C)"
      - name: Smoke-test actual x86 proxy loading and exports on Windows
        shell: pwsh
        run: |
          cargo build --locked --release --target i686-pc-windows-msvc --bin ddraw_loader_smoke
          & 'target/i686-pc-windows-msvc/release/ddraw_loader_smoke.exe' 'target/i686-pc-windows-msvc/release/ddraw.dll'
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows x86 DLL load/export smoke failed' }
      - name: Prepare clean game directory layout
        shell: pwsh
        env:
          CRIMSONSKIESFIX_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          New-Item -ItemType Directory -Force 'dist/CrimsonSkiesFix' | Out-Null
          Copy-Item 'target/i686-pc-windows-msvc/release/ddraw.dll' 'dist/ddraw.dll'
          Copy-Item 'CrimsonSkiesFix/CrimsonSkiesFix.ini.example' 'dist/CrimsonSkiesFix/CrimsonSkiesFix.ini.example'
          Copy-Item 'README.md' 'dist/CrimsonSkiesFix/README.md'
          Copy-Item '../LICENSE' 'dist/CrimsonSkiesFix/LICENSE'

          # Bundle source provenance and exact DLL digest to disambiguate
          # identically named PR artifacts (this is not code signing).
          $commit = $env:CRIMSONSKIESFIX_COMMIT
          if ($commit -notmatch '^[0-9a-fA-F]{40}$') { throw 'Missing source SHA' }
          $commit = $commit.ToLowerInvariant()
          $versionMatch = Select-String -Path 'Cargo.toml' -Pattern '^version\s*=\s*"([^"]+)"\s*$' | Select-Object -First 1
          if ($null -eq $versionMatch) { throw 'Missing crate version' }
          $version = $versionMatch.Matches[0].Groups[1].Value
          $sha256 = (Get-FileHash -Path 'dist/ddraw.dll' -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item 'dist/ddraw.dll').Length
          $identity = "CrimsonSkiesFix $version-$($commit.Substring(0,8)) x86"
          $manifestPath = 'dist/CrimsonSkiesFix/build-info.txt'
          @(
            'Project=CrimsonSkiesFix'
            "Version=$version"
            "Commit=$commit"
            "LogIdentity=$identity"
            'Architecture=Windows-x86'
            "DllSha256=$sha256"
            "DllSizeBytes=$size"
            "Source=https://github.com/legluondunet/CrimsonSkiesFix/tree/$commit"
          ) | Set-Content -LiteralPath $manifestPath -Encoding utf8
          $actualManifest = Get-Content -LiteralPath $manifestPath
          if (-not ($actualManifest -ccontains "Commit=$commit") -or
              -not ($actualManifest -ccontains "LogIdentity=$identity") -or
              -not ($actualManifest -ccontains "DllSha256=$sha256") -or
              -not ($actualManifest -ccontains "DllSizeBytes=$size")) {
            throw 'Build provenance manifest is inconsistent'
          }
          $repoLicense = (Get-FileHash -Path '../LICENSE' -Algorithm SHA256).Hash
          $distLicense = (Get-FileHash -Path 'dist/CrimsonSkiesFix/LICENSE' -Algorithm SHA256).Hash
          if ($repoLicense -ne $distLicense) { throw 'Packaged license differs from repository' }
          $files = @(Get-ChildItem -LiteralPath dist -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'ddraw.dll') {
            throw 'Invalid game-root layout: exactly one ddraw.dll permitted'
          }
          if (Test-Path 'dist/CrimsonSkiesFix/CrimsonSkiesFix.ini') {
            throw 'Release archive must never ship an active user INI'
          }
          if (-not (Test-Path 'dist/CrimsonSkiesFix/CrimsonSkiesFix.ini.example')) {
            throw 'Missing non-overwriting INI template'
          }
          $template = @(Get-Content 'dist/CrimsonSkiesFix/CrimsonSkiesFix.ini.example')
          $defaults = @($template | Where-Object { $_.Trim() -eq 'Log=0' })
          if ($defaults.Count -ne 1) { throw 'Default logging must be disabled' }
          $roffileOff = @($template | Where-Object { $_.Trim() -eq 'RoffileTerminatorFix=0' })
          $roffileOn = @($template | Where-Object { $_.Trim() -eq 'RoffileTerminatorFix=1' })
          if ($roffileOff.Count -ne 0 -or $roffileOn.Count -ne 1) {
            throw 'Verified Wine-only ROFFILE parser guard must be enabled by default on first run'
          }
          # Explicit project policy: native Video Graphics/Resolution
          # lock and AskForVDev dialog bypass are enabled on first run.
          $gosOn = @($template | Where-Object { $_.Trim() -eq 'GosVideoLock=on' })
          $adapterOn = @($template | Where-Object { $_.Trim() -eq 'ExperimentalWindowedAdapter=1' })
          $wideOn = @($template | Where-Object { $_.Trim() -eq 'Native3DWidescreen=1' })
          $desktopOn = @($template | Where-Object { $_.Trim() -eq 'DesktopResolution=1' })
          $imageFixOn = @($template | Where-Object { $_.Trim() -eq 'LegacyOffscreenRGB565=1' })
          $focusOn = @($template | Where-Object { $_.Trim() -eq 'FocusRepaint=1' })
          $eraseOn = @($template | Where-Object { $_.Trim() -eq 'WindowEraseGuard=1' })
          if ($gosOn.Count -ne 1 -or $adapterOn.Count -ne 1 -or
              $wideOn.Count -ne 1 -or $desktopOn.Count -ne 1 -or
              $imageFixOn.Count -ne 1 -or $focusOn.Count -ne 1 -or $eraseOn.Count -ne 1) {
            throw 'Default native graphics / first-image fix / focus recovery / erase guard are incomplete'
          }
          foreach ($invalid in @('GosVideoLock=off','ExperimentalWindowedAdapter=0','Native3DWidescreen=0','LegacyOffscreenRGB565=0','FocusRepaint=0','WindowEraseGuard=0')) {
            if (@($template | Where-Object { $_.Trim() -eq $invalid }).Count -gt 0) {
              throw "Conflicting disabled first-run option: $invalid"
            }
          }
          $actualFiles = @(Get-ChildItem -Path dist -File -Recurse |
            ForEach-Object { $_.FullName.Substring((Resolve-Path dist).Path.Length + 1).Replace('\', '/') } |
            Sort-Object)
          $expectedFiles = @('CrimsonSkiesFix/CrimsonSkiesFix.ini.example', 'CrimsonSkiesFix/README.md', 'CrimsonSkiesFix/LICENSE', 'CrimsonSkiesFix/build-info.txt', 'ddraw.dll') |
            Sort-Object
          if (Compare-Object $actualFiles $expectedFiles) {
            throw 'Unexpected files in the game update archive'
          }
          if (Test-Path 'dist/CrimsonSkiesFix.log') { throw 'Log must not be bundled' }
          if (Test-Path 'dist/CrimsonSkiesFix/CrimsonSkiesFix.log') { throw 'Old log path must not be bundled' }
      - name: Verify staged artifact using independent Python verifier
        shell: pwsh
        env:
          CRIMSONSKIESFIX_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tools/verify_release_candidate.py --directory dist --expected-commit $env:CRIMSONSKIESFIX_COMMIT --cargo-toml Cargo.toml --license ../LICENSE
          if ($LASTEXITCODE -ne 0) { throw 'Independent candidate validation failed before upload' }
      - name: Publish experimental x86 proxy and clean game layout
        uses: actions/upload-artifact@v4
        with:
          name: CrimsonSkiesFix-ddraw-Windows-x86-EXPERIMENTAL
          path: CrimsonSkiesFix/dist/
          if-no-files-found: error
      - name: Verify standalone windowed probe PE machine is Intel x86
        shell: pwsh
        run: |
          $exe = 'target/i686-pc-windows-msvc/release/windowed_ddraw_probe.exe'
          if (-not (Test-Path $exe)) { throw 'Standalone windowed DirectDraw probe EXE is missing' }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          if ($machine -ne 0x014C) { throw "Windowed probe is not i686: 0x$($machine.ToString('X'))" }
          Write-Host 'Standalone windowed probe verified x86'

  verify-downloaded-artifact:
    name: verify-download
    needs: windows-x86
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: External game exit observer self-test on Linux
        run: python3 CrimsonSkiesFix/tools/verify_game_exit.py --self-test
      - name: Download actual Windows x86 candidate archive
        uses: actions/download-artifact@v4
        with:
          name: CrimsonSkiesFix-ddraw-Windows-x86-EXPERIMENTAL
          path: candidate
      - name: Verify downloaded archive, manifest, license and PE32 DLL
        env:
          CRIMSONSKIESFIX_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 CrimsonSkiesFix/tools/verify_release_candidate.py \
            --directory candidate \
            --expected-commit "$CRIMSONSKIESFIX_COMMIT" \
            --cargo-toml CrimsonSkiesFix/Cargo.toml \
            --license LICENSE
      - name: Verify downloaded DLL exports independently on Ubuntu
        run: |
          python3 CrimsonSkiesFix/tools/verify_ddraw_exports.py \
            --dll candidate/ddraw.dll \
            --definitions CrimsonSkiesFix/src/ddraw_exports.def
