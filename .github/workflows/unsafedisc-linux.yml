name: Experimental native unSafeDisc CLI (Linux and Windows)

on:
  push:
    branches:
      - feature/unsafedisc-linux-crimson
  pull_request:
    paths:
      - 'src/bin/unsafedisc-linux.rs'
      - 'src/unsafedisc_*.rs'
      - 'docs/unsafedisc-linux.md'
      - 'docs/dll-state-references.md'
      - '.github/workflows/unsafedisc-linux.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86_64:
    name: Linux x86_64 - research CLI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit tests (synthetic fixtures only)
        run: cargo test --bin unsafedisc-linux
      - name: Build native Linux executable
        run: cargo build --release --bin unsafedisc-linux
      - name: Smoke test CLI
        run: |
          ./target/release/unsafedisc-linux --help
          if ./target/release/unsafedisc-linux unpack; then
            echo "ERROR: unsupported unpack command unexpectedly succeeded"
            exit 1
          fi
          # Historical-only entry must not need any Crimson game file,
          # and must reject a missing/incorrect original executable.
          if ./target/release/unsafedisc-linux inspect-historical --unsafedisc ./nonexistent-original-unSafedisc.exe; then
            echo "ERROR: missing historical executable unexpectedly accepted"
            exit 1
          fi
      - name: Temporary archived original-tool SHA audit (no execution or artifact)
        shell: bash
        run: |
          set -euo pipefail
          zipfile="${RUNNER_TEMP}/unsfd155-source.zip"
          if ! curl --location --fail --silent --show-error --retry 2 --max-time 20 \
             "https://sta.c64.org/winprg/unsfd155.zip" --output "$zipfile"; then
            echo "Historic archive host not reachable; no original-file verification possible."
            exit 0
          fi
          python3 - "$zipfile" "${RUNNER_TEMP}/verified_unsafedisc155.exe" <<'PY'
          import hashlib,sys,zipfile
          archive,output=sys.argv[1:]
          expected="e484c9aadf8b3b5bf0db58b26cb9ecfcaba0fd971fb1bb66216f558f0f1eaa9f"
          try:
              with zipfile.ZipFile(archive) as zf:
                  for name in zf.namelist():
                      metadata=zf.getinfo(name)
                      if metadata.is_dir() or metadata.file_size>100000:
                          continue
                      data=zf.read(name)
                      sha=hashlib.sha256(data).hexdigest()
                      print("Archived entry:",repr(name),"size",len(data),"SHA256",sha)
                      if len(data)==20480 and sha==expected:
                          with open(output,"wb") as f: f.write(data)
                          print("EXACT OWNER-ORIGINAL HISTORICAL TOOL MATCHED")
          except (zipfile.BadZipFile,OSError) as e:
              print("Unable to parse historical archive:",e)
          PY
          if test -f "${RUNNER_TEMP}/verified_unsafedisc155.exe"; then
            echo "Read-only original historical CLI audit:"
            ./target/release/unsafedisc-linux inspect-historical \
              --unsafedisc "${RUNNER_TEMP}/verified_unsafedisc155.exe" || \
              echo "Original historical audit rejected one or more exact opcode windows."
          else
            echo "No exact SHA-pinned 20480-byte tool in historical archive."
          fi
          if test -f "${RUNNER_TEMP}/verified_unsafedisc155.exe"; then
            public="${RUNNER_TEMP}/unsafedisc155_public.exe"
            if curl --fail --location --silent --show-error --retry 2 \
              "https://raw.githubusercontent.com/nckstwrt/SafeDiscLoader/4d1dc33e6e63a4ddca77bbcfa44a7ff98180e064/UnSafeDisc%20and%20SafeDisc2Cleaner/unSafedisc155_version.exe" \
              --output "$public" &&
               test "$(stat -c%s "$public")" = 18944 &&
               test "$(git hash-object "$public")" = 825c467b6b403e1c85a5875ede5696dedfe17652; then
              python3 - "${RUNNER_TEMP}/verified_unsafedisc155.exe" "$public" <<'PY'
          import itertools,struct,sys
          def pe_sections(path):
              data=open(path,"rb").read()
              pe=struct.unpack_from("<I",data,0x3c)[0]
              count=struct.unpack_from("<H",data,pe+6)[0]
              opt=struct.unpack_from("<H",data,pe+20)[0]
              hdr=pe+24+opt
              result={}
              for i in range(count):
                  at=hdr+i*40
                  name=data[at:at+8].split(b"\x00",1)[0].decode("ascii","replace")
                  raw_size=struct.unpack_from("<I",data,at+16)[0]
                  rva=struct.unpack_from("<I",data,at+12)[0]
                  off=struct.unpack_from("<I",data,at+20)[0]
                  result[name]=(rva,data[off:off+raw_size])
              return result
          x=pe_sections(sys.argv[1]);y=pe_sections(sys.argv[2])
          for name in ("CODE","DATA"):
              if name not in x or name not in y:
                  print("PE missing section",name)
                  continue
              rva,original=x[name];other_rva,public=y[name]
              print("COMPARE",name,"RVAs",hex(rva),hex(other_rva),
                    "lengths",len(original),len(public))
              n=min(len(original),len(public))
              diffs=[i for i in range(n) if original[i]!=public[i]]
              spans=[]
              for k,group in itertools.groupby(enumerate(diffs),lambda t:t[1]-t[0]):
                  chunk=[v for _,v in group]
                  spans.append((chunk[0],chunk[-1]+1))
              print("CHANGED-BYTES",len(diffs),"DIFFERENT-SPANS",len(spans))
              for start,end in spans[:80]:
                  print("DIFF",name,"RVA",hex(rva+start),
                        "VA",hex(0x400000+rva+start),"length",end-start)
              if len(spans)>80:print("MORE-DIFF-SPANS",len(spans)-80)
          PY
            else
              echo "Pinned public comparison binary inaccessible or wrong hash."
            fi
            rm -f -- "$public"
          fi
          rm -f -- "$zipfile" "${RUNNER_TEMP}/verified_unsafedisc155.exe"
      - name: Upload experimental Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: unsafedisc-linux-x86_64-inspect-only
          path: target/release/unsafedisc-linux
          if-no-files-found: error

  windows-x86_64:
    name: Windows x86_64 - research CLI
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit tests (synthetic fixtures only)
        run: cargo test --bin unsafedisc-linux
      - name: Build native Windows executable
        run: cargo build --release --bin unsafedisc-linux
      - name: Smoke test CLI
        shell: pwsh
        run: |
          & .\target\release\unsafedisc-linux.exe --help
          if ($LASTEXITCODE -ne 0) {
            throw "Windows CLI --help failed"
          }
          # GitHub Actions' PowerShell wrapper normally treats a native
          # command's nonzero exit status as a job failure. Here that
          # failure is exactly what we are testing.
          $PSNativeCommandUseErrorActionPreference = $false
          & .\target\release\unsafedisc-linux.exe unpack
          if ($LASTEXITCODE -eq 0) {
            throw "ERROR: unsupported unpack command unexpectedly succeeded"
          }
          Write-Host "Unsupported unpack command was correctly rejected."
          & .\target\release\unsafedisc-linux.exe inspect-historical --unsafedisc .\nonexistent-original-unSafedisc.exe
          if ($LASTEXITCODE -eq 0) {
            throw "ERROR: missing historical executable unexpectedly accepted"
          }
          Write-Host "Missing historical original was correctly rejected."
          exit 0
      - name: Upload experimental Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: unsafedisc-windows-x86_64-inspect-only
          path: target/release/unsafedisc-linux.exe
          if-no-files-found: error
