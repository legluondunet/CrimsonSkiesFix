[package]
name = "crimson-winmm-runtime"
version = "1.1.0-rc.1"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "Standalone WinMM bootstrap using the original CrimsonSkiesFix game hooks"

[lib]
name = "winmm"
path = "../src/lib.rs"
crate-type = ["cdylib"]

[features]
default = ["winmm-bootstrap"]
winmm-bootstrap = []

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
