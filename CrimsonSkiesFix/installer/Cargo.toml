[package]
name = "crimsonskiesfix-launcher"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Standalone Crimson Skies installer, verifier and launcher"

[[bin]]
name = "CrimsonSkiesFix"
path = "src/main.rs"

[features]
default = []
# Separate v1.1 test installer; never enabled by the v1.0 release workflow.
winmm-installer = []

[dependencies]
# MIT-licensed pure-Rust Windows Cabinet reader; supports legacy LZX.
cab = "=0.6.0"
# Read-only verification of managed GOS VIDEO.SCRIPT zlib payload.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
