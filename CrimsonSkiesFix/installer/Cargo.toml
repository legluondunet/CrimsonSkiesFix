[package]
name = "crimsonskiesfix-launcher"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Standalone Crimson Skies installer, verifier and launcher"

[[bin]]
name = "CrimsonSkiesFix"
path = "src/main.rs"

[features]
default = []
# Separate v1.1 test installer; never enabled by the v1.0 release workflow.
winmm-installer = []
# New nested layout; two bundled DLLs, opt-in only until native tests pass.
winmm-split-install = ["winmm-installer"]
# Experimental alternative: game WinMM remains native, only DDRAW import name is
# redirected in suspended child memory. NO app-local winmm.dll is deployed.
import-alias-install = ["winmm-split-install"]
# Architecture approved for 1.1: launcher + one fix.dll, game/ child, no system DLL proxy.
unified-fix-install = ["import-alias-install"]
# Explicitly private builds only. Requires an owner-supplied, SHA-256-verified
# official Microsoft 1.02 updater at compile time. NEVER enable in public CI,
# release workflows, or distributed artifacts without redistribution permission.
embed-owner-patch102 = []
# Experimental CD FR offline path: reconstruct 1.02 inside the one-file launcher.
# Uses only the user's exact original CD. Never enabled in public release builds.
native-fr-cd = ["unified-fix-install", "dep:unsafedisk-native"]

[dependencies]
# GPL native reconstruction from draft unsafedisk PR #5, pinned to a reviewed
# commit; linked into CrimsonSkiesFix.exe, never shipped as a separate binary.
unsafedisk-native = { package = "crimson-patcher", git = "https://github.com/legluondunet/unsafedisk.git", rev = "0e708315ca2182359f4407cb203f7028f8b1bd32", optional = true }

# MIT-licensed pure-Rust Windows Cabinet reader; supports legacy LZX.
cab = "=0.6.0"
# Read-only verification of managed GOS VIDEO.SCRIPT zlib payload.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
