[package]
name = "crimson-skies-fix"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "32-bit DirectDraw compatibility proxy for Crimson Skies"

[features]
winmm-bootstrap = []

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[lib]
name = "ddraw"
crate-type = ["cdylib"]

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
