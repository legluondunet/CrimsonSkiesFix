[package]
name = "crimson-winmm-loader"
version = "1.1.0-rc.1"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "Minimal WinMM bootstrap and import proxy for the organized CrimsonSkiesFix layout"

[lib]
name = "winmm"
path = "src/lib.rs"
crate-type = ["cdylib"]

[features]
default = ["winmm-bootstrap"]
winmm-bootstrap = []

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
